name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Build and push Docker image
        if: success()
        continue-on-error: true
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          if [ ! -f .release-prepared ]; then
            echo "No release prepared — skipping Docker build"
            exit 0
          fi

          VERSION=$(cat .release-prepared)
          echo "Building Docker image for version ${VERSION}"

          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true
          docker buildx create --use || true

          echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USER}" --password-stdin

          docker buildx build . \
            --file docker/app.Dockerfile \
            --platform linux/amd64,linux/arm64 \
            -t docker.io/${DOCKER_USER}/tgsentinel:latest \
            -t docker.io/${DOCKER_USER}/tgsentinel:${VERSION} \
            --push

          echo "Docker Hub image pushed for ${VERSION}"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true
          docker buildx build . \
            --file docker/app.Dockerfile \
            --platform linux/amd64,linux/arm64 \
            -t ghcr.io/${{ github.repository_owner }}/tgsentinel:latest \
            -t ghcr.io/${{ github.repository_owner }}/tgsentinel:${VERSION} \
            --push 2>/dev/null || echo "Warning: GHCR push failed (non-fatal)"

          echo "Docker image build complete for ${VERSION}"

      - name: Sync docker/app.Dockerfile to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f .release-prepared ]; then
            echo "No release prepared — skipping sync"
            exit 0
          fi
          VERSION=$(cat .release-prepared)
          echo "Syncing docker/app.Dockerfile for version ${VERSION}"
          DOCKERFILE_SHA=$(gh api repos/${{ github.repository }}/contents/docker/app.Dockerfile --jq '.sha')
          ENCODED_DOCKERFILE=$(base64 -w 0 docker/app.Dockerfile)
          gh api repos/${{ github.repository }}/contents/docker/app.Dockerfile \
            -X PUT \
            -f message="chore: update Dockerfile APP_VERSION to ${VERSION}" \
            -f content="$ENCODED_DOCKERFILE" \
            -f sha="$DOCKERFILE_SHA" \
            --jq '.commit.sha'
          echo "docker/app.Dockerfile synced for ${VERSION}"
